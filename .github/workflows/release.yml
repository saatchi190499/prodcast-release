name: Build and assemble ProdCast release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (vX.Y.Z)
        required: true
        default: v0.6.0
      component_tag:
        description: Matching App, Agent, and Worker candidate tag
        required: true
        default: v0.6.0-rc.1
      base_tag:
        description: Published base release tag
        required: true
        default: v0.5
      base_archive:
        description: Complete archive asset in the base release
        required: true
        default: ProdCast-v0.5.0-complete.zip

permissions:
  contents: write

concurrency:
  group: prodcast-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  manager:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked build dependencies
        working-directory: prodcast-manager
        run: python -m pip install -r requirements-build.lock.txt
      - name: Build and smoke-test standalone Manager
        working-directory: prodcast-manager
        shell: pwsh
        run: ./build.ps1 -Python python -Output dist
      - name: Stage versioned Manager executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/manager -Force | Out-Null
          Copy-Item prodcast-manager/dist/ProdCast-Manager.exe "dist/manager/ProdCast-Manager-${{ inputs.version }}.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-manager
          path: dist/manager/*.exe
          if-no-files-found: error
          compression-level: 0

  assemble:
    needs: manager
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-manager
          path: dist/manager
      - name: Assemble and upload verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python prodcast-manager/release/assemble.py
          --version "${{ inputs.version }}"
          --component-tag "${{ inputs.component_tag }}"
          --base-tag "${{ inputs.base_tag }}"
          --base-archive "${{ inputs.base_archive }}"
          --manager-exe "dist/manager/ProdCast-Manager-${{ inputs.version }}.exe"
