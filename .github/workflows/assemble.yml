name: Assemble complete release
on:
  workflow_dispatch:
    inputs:
      plan:
        description: Reviewed JSON plan path under plans/ (exact base and component hashes)
        type: string
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: release-assembly
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Test release tooling
        run: python -m unittest discover -s tests -v
      - name: Build and upload Complete to draft
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ inputs.plan }}
        run: python scripts/assemble_release.py --plan "$PLAN"
      - name: Read assembled version
        id: release-version
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          value = {'version': json.loads(Path('dist/assembled/release-manifest.json').read_text())['version']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('value=' + json.dumps(value) + '\n')
          PYCODE
      - name: Verify and stage intermediate component packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/retain_inputs.py stage
      - name: Retain assembly inputs for seven days
        id: retained
        uses: actions/upload-artifact@v4
        with:
          name: release-inputs-${{ fromJSON(steps.release-version.outputs.value).version }}
          path: dist/retained-inputs/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Remove archived component duplicates from draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
        run: python scripts/retain_inputs.py cleanup --artifact-id "$ARTIFACT_ID"
