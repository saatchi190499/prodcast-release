name: Publish approved release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing assembled draft version
        type: string
        required: true
      manifest_sha256:
        description: Exact release-manifest.json SHA256 used in compatibility testing
        type: string
        required: true
      validation_note:
        description: Compatibility test result or link, including installation/upgrade scope
        type: string
        required: true
      compatibility_approved:
        description: I approve publishing this exact tested package
        type: boolean
        required: true
        default: false
permissions:
  contents: write
concurrency:
  group: release-assembly
  cancel-in-progress: false
jobs:
  publish:
    if: inputs.compatibility_approved
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release-publication
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.7'
      - name: Publish exact approved package without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          VALIDATION_NOTE: ${{ inputs.validation_note }}
        run: python scripts/publish_release.py --version "$VERSION" --manifest-sha256 "$MANIFEST_SHA256" --validation-note "$VALIDATION_NOTE" --approved
